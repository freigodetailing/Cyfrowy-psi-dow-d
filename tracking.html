<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff7e67">
    <title>Śledzenie Pupila - Psie Breloki</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const savedTheme = localStorage.getItem('appTheme') || 'orange';
        if (savedTheme !== 'orange') {
            document.documentElement.setAttribute('data-theme', savedTheme);
        }
    </script>
</head>
<body class="tracking-body">

    <div id="loader" class="loader-container">
        <div class="paw-loader"><i class="fa-solid fa-paw"></i></div>
    </div>

    <!-- Tracking Header -->
    <header class="tracking-header">
        <button onclick="window.location.href='panel.html'" class="back-btn-circle">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <div class="tracking-pet-info">
            <div class="tracking-avatar-container">
                <img id="petAvatar" src="./photos/podstawa.png" alt="Avatar">
            </div>
            <div class="tracking-titles">
                <h2 id="petName">Ładowanie...</h2>
                <div class="live-status">
                    <span class="pulse-dot"></span> Podgląd na żywo
                </div>
            </div>
        </div>
    </header>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Location Info Card -->
    <div class="location-info-card">
        <div class="info-item">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <div>
                <span class="info-label">Ostatnio widziany:</span>
                <span id="lastSeenTime" class="info-value">Czekam na dane...</span>
            </div>
        </div>
        <div class="info-item">
            <i class="fa-solid fa-map-location-dot"></i>
            <div>
                <span class="info-label">Współrzędne:</span>
                <span id="coordinates" class="info-value">... , ...</span>
            </div>
        </div>
        <div class="nav-modes" style="display: flex; gap: 0.5rem; margin-top: 1rem;">
            <button id="navCarBtn" class="btn-outline flex-1" style="justify-content: center; font-size: 0.85rem;">
                <i class="fa-solid fa-car"></i> Samochodem
            </button>
            <button id="navFootBtn" class="btn-action flex-1" style="justify-content: center; font-size: 0.85rem;">
                <i class="fa-solid fa-person-walking"></i> Pieszo
            </button>
        </div>
        <a id="externalMapsBtn" href="#" target="_blank" class="btn-outline w-100" style="margin-top: 0.8rem; justify-content: center; font-size: 0.8rem; opacity: 0.7;">
            <i class="fa-solid fa-up-right-from-square"></i> Google Maps (Głosowa)
        </a>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <script src="tracking.js"></script>
</body>
</html>
