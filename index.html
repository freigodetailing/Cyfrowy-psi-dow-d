<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff7e67">
    <title>Profil Psa</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const savedTheme = localStorage.getItem('appTheme') || 'orange';
        if (savedTheme !== 'orange') {
            document.documentElement.setAttribute('data-theme', savedTheme);
        }
    </script>
</head>
<body>
    
    <!-- Loader before data loads -->
    <div id="loader" class="loader-container">
        <div class="paw-loader"><i class="fa-solid fa-paw"></i></div>
    </div>

    <div id="app" class="app-container hidden">
        <!-- Curved Header Background -->
        <div class="header-bg">
            <!-- Decorative paw prints -->
            <i class="paw fa-solid fa-paw"></i>
            <i class="paw fa-solid fa-paw"></i>
            <i class="paw fa-solid fa-paw"></i>
            <i class="paw fa-solid fa-paw"></i>
            <i class="paw fa-solid fa-paw"></i>
            <i class="paw fa-solid fa-paw"></i>
            <i class="paw fa-solid fa-paw"></i>
        </div>

        <!-- Owner Badge -->
        <div id="ownerBadge" class="owner-badge hidden">
            <i class="fa-solid fa-shield-dog"></i> Właściciel
        </div>

        <!-- Settings Button -->
        <div id="settingsBtn" class="settings-btn" aria-label="Ustawienia motywu">
            <i class="fa-solid fa-gear"></i>
        </div>

        <main class="profile-content">
            <!-- Top Profile Section -->
            <div class="profile-top">
                <div class="image-outer-ring">
                    <div class="image-wrapper">
                        <img id="dogImage" src="" alt="Zdjęcie psa">
                    </div>
                </div>
                <div class="name-like-wrapper">
                    <h1 id="dogName" class="dog-name">Imię Psa</h1>
                    <button id="likeBtn" class="like-button" aria-label="Polub profil">
                        <i class="fa-solid fa-heart"></i> <span id="likeCount">0</span>
                    </button>
                </div>
                <p class="dog-subtitle"><i class="fa-solid fa-cake-candles"></i> <span id="dogAge">-</span></p>
                
                <!-- Quick Actions -->
                <div class="action-buttons">
                    <a id="phoneBtn" href="#" class="btn-action btn-call">
                        <i class="fa-solid fa-phone"></i> Zadzwoń
                    </a>
                    <a id="smsBtn" href="#" class="btn-action btn-message">
                        <i class="fa-solid fa-comment-sms"></i> Napisz
                    </a>
                </div>
            </div>

            <!-- Traits Section (Ukryte domyślnie, pokazane jeśli są dane) -->
            <div id="traitsSection" class="traits-container hidden">
                <h3>Znaki szczególne</h3>
                <div class="traits-list" id="dogTraits">
                    <!-- Zostaną wstrzyknięte przez JS -->
                </div>
            </div>

            <!-- List Information Sections -->
            <div class="info-sections">
                <!-- Owner Info -->
                <div class="info-item">
                    <div class="info-icon owner-icon"><i class="fa-solid fa-user"></i></div>
                    <div class="info-text">
                        <h3>Właściciel</h3>
                        <p id="ownerName">-</p>
                    </div>
                </div>

                <!-- Health / Important Info -->
                <div class="info-item">
                    <div class="info-icon health-icon"><i class="fa-solid fa-notes-medical"></i></div>
                    <div class="info-text">
                        <h3>Ważne informacje</h3>
                        <p id="dogHealth">-</p>
                    </div>
                </div>
            </div>

            <!-- Bottom Actions -->
            <div class="bottom-actions">
                <button id="shareBtn" class="btn-outline">
                    <i class="fa-solid fa-share-nodes"></i> Udostępnij profil
                </button>
                <button id="forumBtn" class="btn-outline">
                    <i class="fa-solid fa-comments"></i> Forum
                </button>
            </div>
        </main>
        
        <footer>
            <a href="#" class="footer-link">Cyfrowy Dowód Pupila <i class="fa-solid fa-microchip"></i></a>
        </footer>
        
        <!-- Floating Store Button -->
        <a href="#" class="floating-store-btn" title="Kup brelok" aria-label="Sklep">
            <i class="fa-solid fa-plus"></i>
        </a>
    </div>

    <!-- Color Modal -->
    <div id="colorModalOverlay" class="color-modal-overlay">
        <div class="color-modal">
            <h3>Ustawienia</h3>
            
            <div class="settings-section">
                <h4>Motyw kolorystyczny</h4>
                <div class="color-grid">
                    <div class="color-circle c-orange" data-color="orange" title="Pomarańczowy"></div>
                    <div class="color-circle c-blue" data-color="blue" title="Niebieski"></div>
                    <div class="color-circle c-green" data-color="green" title="Zielony"></div>
                    <div class="color-circle c-pink" data-color="pink" title="Różowy"></div>
                    <div class="color-circle c-red" data-color="red" title="Czerwony"></div>
                    <div class="color-circle c-purple" data-color="purple" title="Fioletowy"></div>
                    <div class="color-circle c-gray" data-color="gray" title="Szary"></div>
                </div>
            </div>

            <div class="settings-section auth-section">
                <h4>Konto</h4>
                <div id="unauthControls">
                    <p class="auth-hint">Zaloguj się, aby zarządzać profilem i forum.</p>
                    <button id="modalLoginBtn" class="btn-outline w-100" style="margin-top:0.5rem; justify-content:center;"><i class="fa-solid fa-user"></i> Zaloguj / Zarejestruj</button>
                </div>
                <div id="authControls" class="hidden">
                    <p class="auth-hint">Zalogowany jako:<br><strong id="modalUserEmail">...</strong></p>
                    <button id="modalEditBtn" class="btn-outline w-100 hidden" style="margin-top:0.5rem; justify-content:center;"><i class="fa-solid fa-pen"></i> Edytuj dane pupila</button>
                    <button id="modalLogoutBtn" class="btn-outline w-100" style="margin-top:0.5rem; justify-content:center; color:#e74c3c; border-color:#fadbd8;"><i class="fa-solid fa-right-from-bracket"></i> Wyloguj się</button>
                </div>
            </div>

            <button id="closeModalBtn" class="modal-close">ZAMKNIJ</button>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModalOverlay" class="color-modal-overlay">
        <div class="color-modal" style="max-height: 90vh; overflow-y: auto; text-align: left; padding: 1.5rem;">
            <h3 style="margin-bottom: 1rem; text-align: center;">Edytuj profil</h3>
            <form id="editProfileForm" class="edit-form">
                
                <div class="edit-group" style="text-align: center;">
                    <label style="display:block; margin-bottom:0.5rem;">Zdjęcie Profilowe</label>
                    <div class="edit-image-preview">
                        <img id="editImagePreview" src="./photos/podstawa.png" alt="Podgląd">
                        <input type="file" id="editImageInput" accept="image/*" class="hidden">
                        <button type="button" id="changeImageBtn" class="btn-outline" style="margin: 0.5rem auto 0; font-size:0.8rem;"><i class="fa-solid fa-camera"></i> Zmień zdjęcie</button>
                    </div>
                </div>

                <div class="edit-group">
                    <label for="editDogName">Imię Psa</label>
                    <input type="text" id="editDogName" class="form-input" required>
                </div>

                <div class="edit-group">
                    <label for="editDogAge">Wiek / Data ur.</label>
                    <input type="text" id="editDogAge" class="form-input" placeholder="np. 2021-05-12">
                </div>

                <div class="edit-group">
                    <label for="editDogHealth">Zdrowie / Informacje</label>
                    <textarea id="editDogHealth" class="form-textarea" rows="3"></textarea>
                </div>

                <div class="edit-group">
                    <label for="editOwnerName">Imię Właściciela</label>
                    <input type="text" id="editOwnerName" class="form-input">
                </div>

                <div class="edit-group">
                    <label for="editOwnerPhone">Nr Telefonu (do kontaktu)</label>
                    <input type="tel" id="editOwnerPhone" class="form-input">
                </div>

                <button type="submit" id="saveProfileBtn" class="btn-action w-100" style="margin-top: 1rem; font-size: 1rem;"><i class="fa-solid fa-floppy-disk"></i> Zapisz zmiany</button>
                <button type="button" id="closeEditModalBtn" class="modal-close w-100" style="margin-top: 0.5rem;">ANULUJ</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
