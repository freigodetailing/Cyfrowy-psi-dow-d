<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff7e67">
    <title>Logowanie - Cyfrowy dowód pupila</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=5.0">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        const savedTheme = localStorage.getItem('appTheme') || 'orange';
        if (savedTheme !== 'orange') {
            document.documentElement.setAttribute('data-theme', savedTheme);
        }
    </script>
</head>

<body>
    <div class="app-container login-container">
        <div class="header-bg login-bg">
            <i class="paw fa-solid fa-paw"></i>
            <i class="paw fa-solid fa-paw"></i>
            <i class="paw fa-solid fa-paw"></i>
        </div>

        <div class="login-content">
            <div class="login-card">
                <div class="login-card-icon">
                    <i class="fa-solid fa-address-card"></i>
                </div>
                <h2>Dołącz do Nas</h2>
                <p id="subtitle">Zaloguj się, aby zarządzać brelokami</p>

                <div class="auth-tabs">
                    <button class="auth-tab active" data-mode="login">Zaloguj</button>
                    <button class="auth-tab" data-mode="register">Zarejestruj</button>
                </div>

                <div id="errorMsg" class="auth-error hidden"></div>
                <div id="successMsg" class="auth-success hidden"></div>

                <form id="loginForm" class="login-form">

                    <div id="displayNameGroup" class="form-group hidden">
                        <label for="displayName"><i class="fa-solid fa-id-badge"></i> Nazwa wyświetlana</label>
                        <input type="text" id="displayName" placeholder="np. JanKowalski">
                    </div>

                    <div class="form-group">
                        <label for="email"><i class="fa-solid fa-envelope"></i> Adres e-mail</label>
                        <input type="email" id="email" required placeholder="np. jan@example.com">
                    </div>

                    <div class="form-group">
                        <label for="password"><i class="fa-solid fa-lock"></i> Hasło</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="password" required placeholder="••••••••">
                            <button type="button" class="toggle-password"
                                onclick="togglePasswordVisibility('password', this)">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                    </div>



                    <button type="submit" id="submitBtn" class="btn-action btn-message w-100">
                        Zaloguj się <i class="fa-solid fa-arrow-right"></i>
                    </button>

                    <div class="auth-divider">
                        <span>lub</span>
                    </div>
                    
                    <!-- Kontener dla przycisku Google -->
                    <div id="googleButtonContainer" class="google-btn-wrapper"></div>

                    <div id="loadingIndicator" class="loading-indicator hidden">
                        <i class="fa-solid fa-spinner fa-spin"></i> Przetwarzanie...
                    </div>
                </form>
            </div>
        </div>

        <div class="login-footer-bg">
            <i class="paw fa-solid fa-paw" style="bottom: 15px; left: 10%;"></i>
            <i class="paw fa-solid fa-paw" style="bottom: 35px; right: 25%;"></i>
            <i class="paw fa-solid fa-paw" style="bottom: 20px; right: 10%;"></i>
        </div>
    </div>
    <script src="login.js"></script>
</body>

</html>
