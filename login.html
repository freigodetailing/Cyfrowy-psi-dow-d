<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>Logowanie - Psie Breloki</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const savedTheme = localStorage.getItem('appTheme') || 'orange';
        if (savedTheme !== 'orange') {
            document.documentElement.setAttribute('data-theme', savedTheme);
        }
    </script>
</head>
<body>
    <div class="app-container login-container">
        <div class="header-bg login-bg">
            <i class="paw fa-solid fa-paw"></i>
            <i class="paw fa-solid fa-paw"></i>
            <i class="paw fa-solid fa-paw"></i>
        </div>

        <div class="login-content">
            <div class="login-card">
                <h2>Dołącz do Forum</h2>
                <p id="subtitle">Zaloguj się, aby rozmawiać z innymi</p>

                <div class="auth-tabs">
                    <button class="auth-tab active" data-mode="login">Zaloguj</button>
                    <button class="auth-tab" data-mode="register">Zarejestruj</button>
                </div>

                <div id="errorMsg" class="auth-error hidden"></div>
                <div id="successMsg" class="auth-success hidden"></div>

                <form id="loginForm" class="login-form">

                    <div id="displayNameGroup" class="form-group hidden">
                        <label for="displayName"><i class="fa-solid fa-id-badge"></i> Nazwa wyświetlana</label>
                        <input type="text" id="displayName" placeholder="np. JanKowalski (widoczna na forum)">
                    </div>

                    <div class="form-group">
                        <label for="email"><i class="fa-solid fa-envelope"></i> Adres e-mail</label>
                        <input type="email" id="email" required placeholder="np. jan@example.com">
                    </div>
                    
                    <div class="form-group">
                        <label for="password"><i class="fa-solid fa-lock"></i> Hasło</label>
                        <input type="password" id="password" required placeholder="••••••••">
                    </div>

                    <!-- Sekcja parowania pupila – tylko przy rejestracji -->
                    <div id="petIdGroup" class="hidden">
                        <div class="form-divider"><span>Połącz z pupilem</span></div>

                        <div class="form-group" id="nfcScanArea">
                            <label for="petId"><i class="fa-solid fa-wifi fa-rotate-90"></i> ID Pupila (Zeskanuj lub wpisz)</label>
                            <div class="pet-id-input-wrapper">
                                <input type="text" id="petId" placeholder="Dotknij tu i zbliż brelok...">
                                <span id="petIdStatus" class="pet-id-status"></span>
                            </div>
                            <small id="nfcHintMsg">Kod ID znajdziesz na fizycznym breloku.</small>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="btn-action btn-message w-100">
                        Zaloguj się <i class="fa-solid fa-arrow-right"></i>
                    </button>
                    
                    <div id="loadingIndicator" class="loading-indicator hidden">
                        <i class="fa-solid fa-spinner fa-spin"></i> Przetwarzanie...
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
